<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MELLY | Logout</title>

</head>


<body>


<script>

/* =====================================================
   LOGOUT
   แทน session_unset() + session_destroy()
===================================================== */

// ล้างข้อมูลผู้ใช้ที่กำลัง Login อยู่
localStorage.removeItem("mellyUser");

localStorage.removeItem("mellyUserId");


// กลับไปหน้าแรก
window.location.href = "index.html";

</script>


</body>

</html>
