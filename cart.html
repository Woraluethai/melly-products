
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตะกร้าสินค้า | MELLY</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff8f5;
            color: #333;
        }

        /* Navbar */
        .navbar {
            height: 80px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
            border-bottom: 1px solid #eee;
        }

        .nav-left,
        .nav-right {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .navbar a {
            text-decoration: none;
            color: #555;
            font-size: 16px;
            transition: 0.2s;
        }

        .navbar a:hover {
            color: #e89aa8;
        }

        .logo {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .logo img {
            width: 110px;
            height: auto;
        }

        /* Main */
        .container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 35px;
        }

        .page-title h1 {
            font-size: 32px;
            color: #444;
            margin-bottom: 8px;
        }

        .page-title p {
            color: #999;
        }

        /* Empty cart */
        .empty-cart {
            background: #fff;
            border-radius: 15px;
            padding: 70px 20px;
            text-align: center;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.05);
        }

        .empty-cart h2 {
            margin-bottom: 15px;
            color: #555;
        }

        .empty-cart p {
            color: #999;
            margin-bottom: 25px;
        }

        /* Cart */
        .cart-wrapper {
            display: grid;
            grid-template-columns: 1fr 330px;
            gap: 25px;
            align-items: start;
        }

        .cart-items {
            background: #fff;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.05);
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-item img {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 12px;
            background: #f8f8f8;
        }

        .item-info {
            flex: 1;
        }

        .item-info h3 {
            font-size: 19px;
            margin-bottom: 8px;
            color: #444;
        }

        .item-price {
            color: #e89aa8;
            font-weight: bold;
            font-size: 17px;
        }

        .quantity-box {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
        }

        .quantity-box button {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 50%;
            background: #f3d5db;
            color: #555;
            cursor: pointer;
            font-size: 18px;
        }

        .quantity-box button:hover {
            background: #eab7c1;
        }

        .quantity {
            min-width: 25px;
            text-align: center;
            font-weight: bold;
        }

        .remove-btn {
            border: none;
            background: transparent;
            color: #d88b96;
            cursor: pointer;
            font-size: 14px;
            margin-left: 10px;
        }

        .remove-btn:hover {
            color: #c45f6d;
            text-decoration: underline;
        }

        /* Summary */
        .summary {
            background: #fff;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 20px;
        }

        .summary h2 {
            margin-bottom: 20px;
            color: #444;
            font-size: 22px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            color: #666;
        }

        .summary-total {
            border-top: 1px solid #eee;
            padding-top: 18px;
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 21px;
            font-weight: bold;
            color: #444;
        }

        .total-price {
            color: #e89aa8;
        }

        /* Buttons */
        .btn {
            display: block;
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 13px 20px;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
        }

        .btn-primary {
            background: #e89aa8;
            color: white;
        }

        .btn-primary:hover {
            background: #d77f8e;
        }

        .btn-secondary {
            background: #f7e1e5;
            color: #555;
        }

        .btn-secondary:hover {
            background: #f0d0d6;
        }

        .clear-btn {
            border: none;
            background: transparent;
            color: #999;
            cursor: pointer;
            width: 100%;
            margin-top: 18px;
            font-size: 14px;
        }

        .clear-btn:hover {
            color: #d66;
        }

        /* Responsive */
        @media (max-width: 800px) {
            .navbar {
                padding: 0 15px;
            }

            .nav-left,
            .nav-right {
                gap: 10px;
            }

            .navbar a {
                font-size: 13px;
            }

            .logo {
                display: none;
            }

            .cart-wrapper {
                grid-template-columns: 1fr;
            }

            .cart-item {
                flex-wrap: wrap;
            }

            .cart-item img {
                width: 90px;
                height: 90px;
            }

            .summary {
                position: static;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <div class="nav-left">
            <a href="index.html">หน้าหลัก</a>
            <a href="products.html">สินค้า</a>
            <a href="cart.html">ตะกร้า</a>
            <a href="orders.html">คำสั่งซื้อ</a>
        </div>

        <div class="logo">
            <a href="index.html">
                <img src="images/MELLY.png" alt="MELLY">
            </a>
        </div>

        <div class="nav-right">
            <a href="orders.html">คำสั่งซื้อ</a>
            <a href="profile.html">โปรไฟล์</a>
            <a href="subscribe.html">สมาชิก</a>
            <a href="login.html">เข้าสู่ระบบ</a>
            <a href="register.html">สมัครสมาชิก</a>
        </div>

    </nav>


    <!-- Main -->
    <main class="container">

        <div class="page-title">
            <h1>ตะกร้าสินค้า</h1>
            <p>ตรวจสอบสินค้าและจำนวนสินค้าของคุณ</p>
        </div>


        <!-- Cart Content -->
        <div id="cartContent"></div>

    </main>


    <script>

        // ดึงข้อมูลตะกร้าจาก localStorage
        let cart = JSON.parse(localStorage.getItem("mellyCart")) || [];


        // บันทึกตะกร้า
        function saveCart() {
            localStorage.setItem("mellyCart", JSON.stringify(cart));
        }


        // แสดงตะกร้า
        function displayCart() {

            const cartContent = document.getElementById("cartContent");

            // ถ้าไม่มีสินค้า
            if (cart.length === 0) {

                cartContent.innerHTML = `
                    <div class="empty-cart">
                        <h2>ตะกร้าสินค้าว่าง</h2>
                        <p>ยังไม่มีสินค้าในตะกร้าของคุณ</p>

                        <a href="products.html" class="btn btn-primary"
                           style="max-width:250px;margin:0 auto;">
                            เลือกซื้อสินค้า
                        </a>
                    </div>
                `;

                return;
            }


            let total = 0;
            let totalItems = 0;
            let itemsHTML = "";


            cart.forEach((item, index) => {

                const quantity = Number(item.quantity) || 1;
                const price = Number(item.price) || 0;

                const itemTotal = price * quantity;

                total += itemTotal;
                totalItems += quantity;


                itemsHTML += `
                    <div class="cart-item">

                        <img
                            src="images/${item.image}"
                            alt="${item.name}"
                            onerror="this.src='images/MELLY.png'"
                        >

                        <div class="item-info">

                            <h3>${item.name}</h3>

                            <div class="item-price">
                                ฿${price.toLocaleString()}
                            </div>

                            <div class="quantity-box">

                                <button onclick="decreaseQuantity(${index})">
                                    −
                                </button>

                                <span class="quantity">
                                    ${quantity}
                                </span>

                                <button onclick="increaseQuantity(${index})">
                                    +
                                </button>

                                <button
                                    class="remove-btn"
                                    onclick="removeItem(${index})">
                                    ลบสินค้า
                                </button>

                            </div>

                        </div>

                        <div style="
                            font-weight:bold;
                            color:#555;
                            min-width:100px;
                            text-align:right;
                        ">
                            ฿${itemTotal.toLocaleString()}
                        </div>

                    </div>
                `;
            });


            cartContent.innerHTML = `

                <div class="cart-wrapper">

                    <div class="cart-items">
                        ${itemsHTML}
                    </div>


                    <div class="summary">

                        <h2>สรุปคำสั่งซื้อ</h2>

                        <div class="summary-row">
                            <span>จำนวนสินค้า</span>
                            <span>${totalItems} ชิ้น</span>
                        </div>

                        <div class="summary-row">
                            <span>ราคาสินค้า</span>
                            <span>฿${total.toLocaleString()}</span>
                        </div>

                        <div class="summary-row">
                            <span>ค่าจัดส่ง</span>
                            <span>คำนวณตอนชำระเงิน</span>
                        </div>

                        <div class="summary-total">
                            <span>รวมทั้งหมด</span>
                            <span class="total-price">
                                ฿${total.toLocaleString()}
                            </span>
                        </div>


                        <a href="checkout.html"
                           class="btn btn-primary">
                            ดำเนินการสั่งซื้อ
                        </a>


                        <a href="products.html"
                           class="btn btn-secondary">
                            เลือกซื้อสินค้าต่อ
                        </a>


                        <button
                            class="clear-btn"
                            onclick="clearCart()">
                            ล้างตะกร้าสินค้าทั้งหมด
                        </button>

                    </div>

                </div>
            `;
        }


        // เพิ่มจำนวนสินค้า
        function increaseQuantity(index) {

            if (!cart[index]) return;

            cart[index].quantity =
                (Number(cart[index].quantity) || 0) + 1;

            saveCart();
            displayCart();
        }


        // ลดจำนวนสินค้า
        function decreaseQuantity(index) {

            if (!cart[index]) return;

            const quantity =
                Number(cart[index].quantity) || 1;

            if (quantity > 1) {

                cart[index].quantity = quantity - 1;

            } else {

                cart.splice(index, 1);
            }

            saveCart();
            displayCart();
        }


        // ลบสินค้า
        function removeItem(index) {

            if (!cart[index]) return;

            cart.splice(index, 1);

            saveCart();
            displayCart();
        }


        // ล้างตะกร้า
        function clearCart() {

            if (cart.length === 0) return;

            const confirmClear =
                confirm("คุณต้องการล้างสินค้าทั้งหมดออกจากตะกร้าหรือไม่?");

            if (!confirmClear) return;

            cart = [];

            saveCart();
            displayCart();
        }


        // เริ่มต้นแสดงตะกร้า
        displayCart();

    </script>

</body>
</html>
