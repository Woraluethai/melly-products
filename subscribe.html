
<script>

const form = document.getElementById("subscribeForm");

form.addEventListener("submit", function(event) {

    event.preventDefault();


    const fullname =
        document.getElementById("fullname").value.trim();

    const email =
        document.getElementById("email").value.trim();


    /* =====================================================
       ตรวจข้อมูล
    ===================================================== */

    if (fullname === "") {

        alert("กรุณากรอกชื่อ");

        return;

    }


    if (email === "") {

        alert("กรุณากรอกอีเมล");

        return;

    }


    const emailPattern =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


    if (!emailPattern.test(email)) {

        alert("กรุณากรอกอีเมลให้ถูกต้อง");

        return;

    }


    /* =====================================================
       อ่านสมาชิกเดิม
       
       ไม่ตรวจ duplicate email แล้ว
       ดังนั้นอีเมลเดิมสามารถสมัครซ้ำได้
    ===================================================== */

    let subscribers = [];

    try {

        subscribers =
            JSON.parse(
                localStorage.getItem(
                    "mellySubscribers"
                )
            ) || [];

    }

    catch (error) {

        subscribers = [];

    }


    /* =====================================================
       สร้าง Subscriber ID ใหม่ทุกครั้ง
    ===================================================== */

    let subscriberId = 1;


    if (subscribers.length > 0) {

        const ids = subscribers
            .map(function(item) {

                return Number(item.id) || 0;

            })
            .filter(function(id) {

                return id > 0;

            });


        if (ids.length > 0) {

            subscriberId =
                Math.max(...ids) + 1;

        }

    }


    /* =====================================================
       ข้อมูลสมาชิกใหม่
    ===================================================== */

    const subscriber = {

        id: subscriberId,

        fullname: fullname,

        email: email,

        created_at:
            new Date().toISOString()

    };


    /* =====================================================
       เพิ่มสมาชิกใหม่
       ไม่แทนที่สมาชิกเดิม
    ===================================================== */

    subscribers.push(subscriber);


    localStorage.setItem(
        "mellySubscribers",
        JSON.stringify(subscribers)
    );


    /* =====================================================
       จำสมาชิกที่สมัครครั้งล่าสุด
    ===================================================== */

    localStorage.setItem(
        "mellyLastSubscriber",
        JSON.stringify(subscriber)
    );


    /* =====================================================
       ไปหน้าสำเร็จ
    ===================================================== */

    window.location.href =
        "subscribe_success.html"
        + "?subscriber_id="
        + encodeURIComponent(subscriberId)
        + "&email="
        + encodeURIComponent(email)
        + "&fullname="
        + encodeURIComponent(fullname);

});

</script>
