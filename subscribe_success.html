
<script>

/* =====================================================
   รับข้อมูลจาก URL
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const urlSubscriberId =
    params.get("subscriber_id");


const urlEmail =
    params.get("email");


const urlFullname =
    params.get("fullname");


/* =====================================================
   อ่าน Subscriber ล่าสุด
===================================================== */

let subscriber = null;


try {

    const stored =
        localStorage.getItem(
            "mellyLastSubscriber"
        );


    if (stored) {

        subscriber =
            JSON.parse(stored);

    }

}

catch (error) {

    subscriber = null;

}


/* =====================================================
   ใช้ข้อมูลจาก URL ก่อน
===================================================== */

const finalSubscriberId =
    urlSubscriberId ||
    (
        subscriber
        ? subscriber.id
        : ""
    );


const finalEmail =
    urlEmail ||
    (
        subscriber
        ? subscriber.email
        : ""
    );


const finalFullname =
    urlFullname ||
    (
        subscriber
        ? subscriber.fullname
        : ""
    );


/* =====================================================
   ตรวจข้อมูล
===================================================== */

if (
    !finalSubscriberId ||
    !finalEmail ||
    !finalFullname
) {

    window.location.href =
        "subscribe.html";

}


/* =====================================================
   แสดงชื่อ
===================================================== */

document.getElementById(
    "fullname"
).textContent =
    finalFullname;


/* =====================================================
   รายการความสนใจ
===================================================== */

const interests = [

    "ตุ๊กตาหมี",
    "ตุ๊กตากระต่าย",
    "ตุ๊กตาแมว",
    "ตุ๊กตาสุนัข",
    "ตุ๊กตาเป็ด",
    "ตุ๊กตาม้า",
    "ของขวัญ",
    "ตกแต่งห้อง",
    "โปรโมชั่น",
    "สินค้าใหม่"

];


const icons = {

    "ตุ๊กตาหมี": "🧸",
    "ตุ๊กตากระต่าย": "🐰",
    "ตุ๊กตาแมว": "🐱",
    "ตุ๊กตาสุนัข": "🐶",
    "ตุ๊กตาเป็ด": "🐤",
    "ตุ๊กตาม้า": "🐴",
    "ของขวัญ": "🎁",
    "ตกแต่งห้อง": "🏠",
    "โปรโมชั่น": "🎉",
    "สินค้าใหม่": "✨"

};


/* =====================================================
   อ่านความสนใจที่เคยเลือกของ Subscriber ID นี้
===================================================== */

let allInterests = {};


try {

    allInterests =
        JSON.parse(
            localStorage.getItem(
                "mellySubscriberInterests"
            )
        ) || {};

}

catch (error) {

    allInterests = {};

}


const savedInterests =
    Array.isArray(
        allInterests[String(finalSubscriberId)]
    )
        ? allInterests[String(finalSubscriberId)]
        : [];


/* =====================================================
   สร้างรายการ Checkbox
===================================================== */

const container =
    document.getElementById(
        "interestContainer"
    );


interests.forEach(function(interest) {

    const label =
        document.createElement("label");


    label.className =
        "interest-card";


    label.innerHTML = `

        <input
            type="checkbox"
            name="interests"
            value="${interest}"
            ${savedInterests.includes(interest)
                ? "checked"
                : ""}
        >

        <span class="interest-icon">

            ${icons[interest] || "♡"}

        </span>

        <span>

            ${interest}

        </span>

    `;


    container.appendChild(label);

});


/* =====================================================
   Submit
===================================================== */

document
    .getElementById("interestForm")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const selected =
                Array.from(
                    document.querySelectorAll(
                        'input[name="interests"]:checked'
                    )
                ).map(function(input) {

                    return input.value;

                });


            /* =============================================
               เก็บตาม Subscriber ID
               
               อีเมลซ้ำได้ เพราะ ID ไม่ซ้ำ
            ============================================= */

            allInterests[
                String(finalSubscriberId)
            ] = selected;


            localStorage.setItem(
                "mellySubscriberInterests",
                JSON.stringify(allInterests)
            );


            /* =============================================
               อัปเดต Subscriber ล่าสุด
            ============================================= */

            if (subscriber) {

                subscriber.interests =
                    selected;


                localStorage.setItem(
                    "mellyLastSubscriber",
                    JSON.stringify(subscriber)
                );

            }


            /* =============================================
               ไปหน้าสำเร็จ
            ============================================= */

            window.location.href =
                "subscribe_saved.html"
                + "?subscriber_id="
                + encodeURIComponent(
                    finalSubscriberId
                )
                + "&email="
                + encodeURIComponent(
                    finalEmail
                )
                + "&fullname="
                + encodeURIComponent(
                    finalFullname
                );

        }
    );


</script>
