
<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MELLY | สินค้า</title>


<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #fffdfc;
    color: #554742;
}


/* =====================================================
   NAVBAR
===================================================== */

.navbar {
    height: 68px;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    box-shadow: 0 1px 8px rgba(0,0,0,0.05);
}

.logo {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    height: 52px;
    width: auto;
    object-fit: contain;
}

.menu-left {
    position: absolute;
    left: 40px;
    display: flex;
    gap: 25px;
}

.menu-left a {
    text-decoration: none;
    color: #6b5b56;
    font-size: 13px;
}

.menu-left a:hover {
    color: #d79595;
}

.menu-right {
    position: absolute;
    right: 40px;
    display: flex;
    gap: 20px;
}

.menu-right a {
    text-decoration: none;
    color: #6b5b56;
    font-size: 13px;
}

.menu-right a:hover {
    color: #d79595;
}


/* =====================================================
   DETAIL SECTION
===================================================== */

.detail-section {
    width: 100%;
    min-height: calc(100vh - 68px);
    padding: 70px 7%;

    display: flex;
    justify-content: center;
    align-items: center;
}


/* =====================================================
   DETAIL BOX
===================================================== */

.detail-box {
    width: 100%;
    max-width: 1200px;

    background: white;

    border-radius: 12px;

    box-shadow:
        0 5px 25px rgba(0,0,0,0.07);

    display: grid;

    grid-template-columns: 1fr 1fr;

    overflow: hidden;
}


/* =====================================================
   IMAGE
===================================================== */

.detail-image-box {
    min-height: 600px;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #fffafa;

    padding: 40px;
}

.detail-image {
    width: 100%;
    height: 520px;

    object-fit: contain;
    object-position: center;
}


/* =====================================================
   INFORMATION
===================================================== */

.detail-info {
    padding: 70px;

    display: flex;
    flex-direction: column;
    justify-content: center;
}

.detail-small {
    font-size: 13px;
    letter-spacing: 3px;

    color: #d08b8d;

    margin-bottom: 15px;
}

.detail-info h1 {
    font-family: Georgia, serif;

    font-size: 42px;
    font-weight: 400;

    color: #594944;

    margin-bottom: 20px;
}

.detail-price {
    font-size: 28px;
    font-weight: 600;

    color: #c77b7b;

    margin-bottom: 25px;
}

.detail-description-title {
    font-size: 15px;
    font-weight: 600;

    color: #594944;

    margin-bottom: 10px;
}

.detail-description {
    font-size: 15px;
    line-height: 1.9;

    color: #8f7e78;

    margin-bottom: 35px;
}


/* =====================================================
   BUTTONS
===================================================== */

.detail-buttons {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

.add-cart-button {
    display: inline-block;

    background: #d88e91;

    color: white;

    text-decoration: none;

    padding: 13px 30px;

    border-radius: 25px;

    font-size: 14px;

    transition: 0.3s;
}

.add-cart-button:hover {
    background: #c77679;

    transform: translateY(-2px);
}

.back-button {
    display: inline-block;

    border: 1px solid #d98d8d;

    color: #c77b7b;

    text-decoration: none;

    padding: 13px 30px;

    border-radius: 25px;

    font-size: 14px;

    transition: 0.3s;
}

.back-button:hover {
    background: #d98d8d;
    color: white;
}


/* =====================================================
   FOOTER
===================================================== */

footer {
    text-align: center;

    padding: 25px;

    background: #fff9f7;

    color: #9b8982;

    font-size: 12px;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 900px) {

    .detail-box {
        grid-template-columns: 1fr;
    }

    .detail-image-box {
        min-height: 450px;
    }

    .detail-image {
        height: 400px;
    }

    .detail-info {
        padding: 45px;
    }

}

@media (max-width: 650px) {

    .navbar {
        height: auto;
        padding: 15px;
        flex-direction: column;
    }

    .logo {
        position: static;
        transform: none;
        margin-bottom: 10px;
    }

    .menu-left,
    .menu-right {
        position: static;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .detail-section {
        padding: 30px 15px;
    }

    .detail-image-box {
        min-height: 350px;
        padding: 20px;
    }

    .detail-image {
        height: 320px;
    }

    .detail-info {
        padding: 30px 25px;
    }

    .detail-info h1 {
        font-size: 32px;
    }

    .detail-buttons {
        flex-direction: column;
    }

    .add-cart-button,
    .back-button {
        text-align: center;
        width: 100%;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<header class="navbar">

    <nav class="menu-left">

        <a href="index.html">
            หน้าแรก
        </a>

        <a href="products.html">
            สินค้า
        </a>

        <a href="cart.html">
            🛒 ตะกร้า
        </a>

        <a href="cart.html">
            สั่งซื้อ
        </a>

    </nav>


    <img
        src="images/MELLY.png"
        class="logo"
        alt="MELLY"
    >


    <nav class="menu-right">

        <a href="orders.html">
            ประวัติการซื้อ
        </a>

        <a href="profile.html">
            โปรไฟล์
        </a>

        <a href="login.html">
            ออกจากระบบ
        </a>

    </nav>

</header>


<!-- =====================================================
     PRODUCT DETAIL
===================================================== -->

<section class="detail-section">

<div class="detail-box">


    <!-- IMAGE -->

    <div class="detail-image-box">

        <img
            id="productImage"
            src=""
            class="detail-image"
            alt=""
        >

    </div>


    <!-- INFORMATION -->

    <div class="detail-info">

        <div class="detail-small">
            MELLY COLLECTION
        </div>


        <h1 id="productName"></h1>


        <div class="detail-price" id="productPrice"></div>


        <div class="detail-description-title">
            รายละเอียดสินค้า
        </div>


        <p
            class="detail-description"
            id="productDescription"
        ></p>


        <!-- BUTTONS -->

        <div class="detail-buttons">

            <a
                href="#"
                class="add-cart-button"
                id="addCartButton"
            >
                🛒 เพิ่มลงตะกร้า
            </a>


            <a
                href="products.html"
                class="back-button"
            >
                ← ย้อนกลับ
            </a>

        </div>

    </div>

</div>

</section>


<footer>

    © 2026 MELLY Doll Shop

</footer>


<script>

/* =====================================================
   ข้อมูลสินค้า
===================================================== */

const products = {

    1: {
        name: "Melly Teddy Bear",
        price: 490,
        image: "ตุ๊กตาหมี.jpg",
        description: "ตุ๊กตาหมีสีขาวแสนน่ารัก นุ่มนิ่มน่ากอด ผลิตจากวัสดุคุณภาพดี เหมาะสำหรับกอด เล่น หรือนำไปตกแต่งห้อง"
    },

    2: {
        name: "Melly Bunny",
        price: 450,
        image: "กระต่าย.webp",
        description: "ตุ๊กตากระต่ายสีเทา หูยาว นุ่มนิ่มน่ากอด ดีไซน์น่ารัก เหมาะสำหรับเป็นเพื่อนคู่ใจและมอบเป็นของขวัญ"
    },

    3: {
        name: "Melly Duck",
        price: 590,
        image: "เป็ด.jpg",
        description: "ตุ๊กตาเป็ดสีเหลืองสดใส แสนน่ารัก เหมาะสำหรับกอด เล่น หรือนำไปตกแต่งห้อง"
    },

    4: {
        name: "Pink Teddy",
        price: 520,
        image: "เท็ดดี้.jpeg",
        description: "ตุ๊กตาหมีสีชมพูแสนน่ารัก นุ่มนิ่มน่ากอด เหมาะสำหรับกอดและเป็นเพื่อนในทุกวัน"
    },

    5: {
        name: "White Horse",
        price: 480,
        image: "ม้า.jpg",
        description: "ตุ๊กตาม้าสีขาวแสนน่ารัก ขนนุ่มฟูน่าสัมผัส เหมาะสำหรับกอด เล่น หรือนำไปตกแต่งห้อง"
    },

    6: {
        name: "Little Cat",
        price: 350,
        image: "แมว.jpeg",
        description: "ตุ๊กตาแมวตัวเล็กแสนน่ารัก ขนนุ่มนิ่มน่ากอด เหมาะสำหรับตั้งโต๊ะ ตกแต่งห้อง หรือเป็นเพื่อนตัวเล็ก"
    },

    7: {
        name: "Cream Giraffe",
        price: 550,
        image: "ยีราฟ.jpg",
        description: "ตุ๊กตายีราฟสีครีม ลวดลายน่ารัก นุ่มนิ่มน่ากอด เหมาะสำหรับตกแต่งห้องหรือมอบเป็นของขวัญ"
    },

    8: {
        name: "Tiger Plush",
        price: 460,
        image: "เสือ.webp",
        description: "ตุ๊กตาเสือแสนน่ารัก ลายโดดเด่น นุ่มนิ่มน่ากอด เหมาะสำหรับกอด เล่น และตกแต่งห้อง"
    },

    9: {
        name: "Melly Dog",
        price: 420,
        image: "หมา.jpg",
        description: "ตุ๊กตาสุนัขแสนน่ารัก ขนนุ่มฟู น่ากอด เหมาะสำหรับเป็นเพื่อนตัวเล็กและใช้ตกแต่งห้อง"
    }

};


/* =====================================================
   รับ ID สินค้าจาก URL
===================================================== */

const params = new URLSearchParams(window.location.search);

let id = parseInt(params.get("id"), 10);

if (!products[id]) {
    id = 1;
}


/* =====================================================
   สินค้าที่เลือก
===================================================== */

const product = products[id];


/* =====================================================
   แสดงข้อมูลสินค้า
===================================================== */

document.title = "MELLY | " + product.name;

document.getElementById("productImage").src =
    "images/" + product.image;

document.getElementById("productImage").alt =
    product.name;

document.getElementById("productName").textContent =
    product.name;

document.getElementById("productPrice").textContent =
    "฿" + product.price.toLocaleString();

document.getElementById("productDescription").textContent =
    product.description;


/* =====================================================
   เพิ่มสินค้าลงตะกร้า
===================================================== */

document.getElementById("addCartButton").addEventListener("click", function(event) {

    event.preventDefault();

    let cart = JSON.parse(
        localStorage.getItem("mellyCart") || "[]"
    );

    const existingItem = cart.find(
        item => String(item.id) === String(id)
    );


    if (existingItem) {

        existingItem.quantity =
            Number(existingItem.quantity || 0) + 1;

    } else {

        cart.push({

            id: id,
            name: product.name,
            price: product.price,
            image: product.image,
            quantity: 1

        });

    }


    localStorage.setItem(
        "mellyCart",
        JSON.stringify(cart)
    );


    alert("เพิ่ม " + product.name + " ลงในตะกร้าแล้ว");

});

</script>


</body>
</html>
